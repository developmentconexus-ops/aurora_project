name: SPK-002 Apply Mutation Preflight

on:
  push:
    branches:
      - spike/m0-owner-trust-002
    paths:
      - ".github/workflows/spk002-apply-mutation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/m0-owner-trust-002
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Apply preflight patch
        run: python scripts/tmp_spk002_preflight.py
      - name: Format and verify focused package
        shell: bash
        run: |
          gofmt -w spikes/m0-owner-trust-002/internal/trust/trust.go
          cd spikes/m0-owner-trust-002
          go mod tidy
          CGO_ENABLED=0 go test -count=1 -run '^TestOperationalMutationRequiresNormalTrustState$' ./internal/trust
      - name: Commit hardened spike and remove helpers
        shell: bash
        run: |
          rm .github/workflows/spk002-apply-mutation-preflight.yml
          rm scripts/tmp_spk002_preflight.py
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add spikes/m0-owner-trust-002/internal/trust/trust.go \
                  spikes/m0-owner-trust-002/go.mod \
                  spikes/m0-owner-trust-002/go.sum \
                  .github/workflows/spk002-apply-mutation-preflight.yml \
                  scripts/tmp_spk002_preflight.py
          git diff --cached --check
          git commit -m 'fix(spike): require normal trust state before mutation'
          git push origin HEAD:spike/m0-owner-trust-002
