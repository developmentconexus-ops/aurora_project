name: Prepare M0 R5 Contract Readiness v2

on:
  push:
    branches:
      - docs/m0-r5-contract-readiness
    paths:
      - "scripts/tmp_patch_prepare_m0_r5.py"
      - ".github/workflows/prepare-m0-r5-contract-readiness-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r5-contract-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align helper with current canonical wording
        run: python scripts/tmp_patch_prepare_m0_r5.py
      - name: Apply R4-aligned A2 and R5 package transformation
        run: python scripts/tmp_prepare_m0_r5.py
      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
      - name: Verify R5 traceability and authority boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          coverage = (root / 'docs/capabilities/CAP-SOVEREIGN-CORE/R5-COVERAGE.md').read_text(encoding='utf-8')
          rows = re.findall(r'^\| `CAP-SOVEREIGN-CORE-REQ-(\d{3})` \| `MIS-M0-SOVEREIGN-CORE-001-CRIT-(\d{3})` \|', coverage, re.M)
          expected = [f'{i:03d}' for i in range(1, 123)]
          got = [r[0] for r in rows]
          if len(rows) != 122 or sorted(got) != expected or len(set(got)) != 122:
              raise SystemExit(f'R5 coverage invalid: rows={len(rows)} unique={len(set(got))}')
          if any(c not in {f'{i:03d}' for i in range(1, 13)} for _, c in rows):
              raise SystemExit('R5 coverage references invalid criterion')

          contract = (root / 'docs/capabilities/CAP-SOVEREIGN-CORE/MIS-M0-SOVEREIGN-CORE-001.md').read_text(encoding='utf-8')
          criteria = re.findall(r'^### `MIS-M0-SOVEREIGN-CORE-001-CRIT-(\d{3})`', contract, re.M)
          if criteria != [f'{i:03d}' for i in range(1, 13)]:
              raise SystemExit(f'Contract criteria mismatch: {criteria}')
          if 'status: proposed' not in contract or 'version: 0.1.0' not in contract:
              raise SystemExit('Mission Contract must remain proposed v0.1.0 at this gate')

          expected_versions = {
              'REQUIREMENTS.md': '0.1.1',
              'SPEC.md': '0.2.0',
              'THREAT-MODEL.md': '0.2.0',
              'TEST-PLAN.md': '0.2.0',
          }
          cap = root / 'docs/capabilities/CAP-SOVEREIGN-CORE'
          for name, version in expected_versions.items():
              text = (cap / name).read_text(encoding='utf-8')
              if 'status: proposed' not in text or f'version: {version}' not in text:
                  raise SystemExit(f'{name} must remain proposed at expected version {version}')

          review = (root / 'docs/reviews/2026-08-07-m0-r5-contract-readiness-review.md').read_text(encoding='utf-8')
          if 'R5 BLOCKED' not in review or 'R6 remains NOT AUTHORIZED' not in review:
              raise SystemExit('R5 review verdict/boundary missing')

          status = (root / 'docs/tracking/STATUS.md').read_text(encoding='utf-8')
          required = [
              'ACRM R5 — Contract Readiness:    AUTHORIZED / BLOCKED ON OPERATOR APPROVAL',
              'ACRM R6+:                       NOT AUTHORIZED',
              'Aurora Core implementation:     PROHIBITED',
              'Mission Contract:               PROPOSED — MIS-M0-SOVEREIGN-CORE-001 v0.1.0; not yet approved',
          ]
          for needle in required:
              if needle not in status:
                  raise SystemExit(f'STATUS boundary missing: {needle}')
          print('R5 coverage: 122/122; Mission criteria: 12; A2/A3 remain proposed; R6 prohibited')
          PY
          git diff --check
      - name: Commit validated docs-only R5 package and remove helpers
        shell: bash
        run: |
          rm .github/workflows/prepare-m0-r5-contract-readiness.yml
          rm .github/workflows/prepare-m0-r5-contract-readiness-v2.yml
          rm scripts/tmp_prepare_m0_r5.py
          rm scripts/tmp_patch_prepare_m0_r5.py
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add docs .github/workflows/prepare-m0-r5-contract-readiness.yml .github/workflows/prepare-m0-r5-contract-readiness-v2.yml scripts/tmp_prepare_m0_r5.py scripts/tmp_patch_prepare_m0_r5.py
          git diff --cached --check
          bad="$(git diff --cached --name-only | grep -Ev '^docs/' || true)"
          if [[ -n "$bad" ]]; then
            echo "non-doc permanent R5 diff detected:" >&2
            echo "$bad" >&2
            exit 1
          fi
          git commit -m 'docs: prepare M0 R5 contract readiness package'
          git push origin HEAD:docs/m0-r5-contract-readiness
