name: Validate SPK-001 Docs Final

on:
  push:
    branches:
      - docs/m0-r4-spk001-evidence
    paths:
      - ".github/workflows/validate-spk001-docs-final.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate
        run: |
          python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
          python scripts/validate_docs.py --generated-root "$RUNNER_TEMP/aurora-generated" --report "$RUNNER_TEMP/docs-validation-report.json"
          grep -q "SPK-AURORA-M0-SOVEREIGN-STORE-001.*PASS / EVIDENCE_COMPLETE / REVIEWED / DECISION_INFORMED / CLOSED" docs/tracking/STATUS.md
          grep -q "ADR-0007.*PROPOSED / EVIDENCE-READY" docs/tracking/STATUS.md
          grep -q "SPK-AURORA-M0-OWNER-TRUST-002.*EXECUTION NOT AUTHORIZED" docs/tracking/STATUS.md
          test ! -e spikes/m0-sovereign-store-001
          git diff --check
