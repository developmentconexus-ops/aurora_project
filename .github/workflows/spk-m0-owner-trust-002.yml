name: SPK-002 Owner Trust

on:
  push:
    branches:
      - spike/m0-owner-trust-002
    paths:
      - "spikes/m0-owner-trust-002/**"
      - ".github/workflows/spk-m0-owner-trust-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/m0-owner-trust-002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Confirm contract is not implemented yet
        run: go test -count=1 ./...
