name: Temporary M0 R7

on:
  push:
    branches:
      - feat/m0-r7-sovereign-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Vet
        if: success()
        env:
          CGO_ENABLED: '0'
        run: go vet ./...
      - name: Build
        if: success()
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/aurora
      - name: Prepare module lock
        if: success()
        env:
          CGO_ENABLED: '0'
        run: go mod tidy
      - name: Upload module lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m0-r7-module-lock
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 7

  windows-trust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Trust package tests when present
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          if (Test-Path 'go.mod') {
            if (Test-Path 'internal/adapters/trustfs') { go test ./internal/adapters/trustfs } else { Write-Host 'trustfs not introduced yet' }
          } else {
            Write-Host 'go.mod not introduced yet'
          }
