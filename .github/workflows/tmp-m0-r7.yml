name: Temporary M0 R7

on:
  push:
    branches:
      - feat/m0-r7-sovereign-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Materialize current GREEN candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/tmp_task01_green.py ]]; then
            python scripts/tmp_task01_green.py
          fi
      - name: Diagnose materialized Go bytes
        shell: bash
        run: |
          set -euo pipefail
          go version
          which gofmt
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          paths = [
              Path('internal/domain/identity/rules.go'),
              Path('internal/adapters/trustfs/publish.go'),
          ]
          for path in paths:
              raw = path.read_bytes()
              print(f'FILE={path} semicolons={raw.count(bytes([59]))} percent={raw.count(bytes([37]))}')
              for idx, line in enumerate(raw.splitlines(), start=1):
                  if b'if ' in line or b':=' in line:
                      print(f'{path}:{idx}: repr={line!r} hex={line.hex()}')
                      if idx > 30:
                          break
          control = Path(os.environ['RUNNER_TEMP']) / 'control.go'
          control.write_bytes(b'package p\nfunc f(){ if x := 1; x > 0 {} }\n')
          print('CONTROL', control.read_bytes(), control.read_bytes().hex())
          result = subprocess.run(['gofmt', '-d', str(control)], text=True, capture_output=True)
          print('CONTROL GOFMT RC', result.returncode)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PY
      - name: Format and lock modules
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          find cmd internal -name '*.go' -print0 | xargs -0 gofmt -w
          go mod tidy
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/aurora" ./cmd/aurora
      - name: TASK-01 real binary continuity and hygiene
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/aurora-task01"
          mkdir -p "$DATA_DIR"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" init > "$RUNNER_TEMP/init.json" 2> "$RUNNER_TEMP/init.err"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" status > "$RUNNER_TEMP/status.json" 2> "$RUNNER_TEMP/status.err"
          if printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" init > "$RUNNER_TEMP/reinit.json" 2> "$RUNNER_TEMP/reinit.err"; then
            echo 'second init unexpectedly succeeded' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          with open(root+'/init.json') as f: init=json.load(f)
          with open(root+'/status.json') as f: status=json.load(f)
          assert init['aurora_id'] == status['aurora_id'], (init, status)
          assert status['trust_state'] == 'NORMAL', status
          assert init['governing_generation'] == 1
          assert status['governing_generation'] == 1
          print('TASK-01 real binary continuity: PASS')
          PY
          if grep -R -F 'fixture-owner-passphrase' "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.err; then
            echo 'fixture passphrase leaked to journey output' >&2
            exit 1
          fi
      - name: Commit verified TASK-01 candidate
        if: ${{ hashFiles('scripts/tmp_task01_green.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/tmp_task01_green.py
          git add -A
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git commit -m "feat(core): initialize sovereign Aurora identity"
          git push origin HEAD:feat/m0-r7-sovereign-core

  windows-trust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Materialize current GREEN candidate
        shell: pwsh
        run: |
          if (Test-Path 'scripts/tmp_task01_green.py') { python scripts/tmp_task01_green.py }
      - name: Diagnose materialized Go bytes
        shell: pwsh
        run: |
          go version
          @'
          from pathlib import Path
          import os, subprocess
          path=Path('internal/adapters/trustfs/publish.go')
          raw=path.read_bytes()
          print('FILE', path, 'semicolons', raw.count(bytes([59])), 'percent', raw.count(bytes([37])))
          for idx,line in enumerate(raw.splitlines(),start=1):
              if b'if ' in line or b':=' in line:
                  print(idx, repr(line), line.hex())
          control=Path(os.environ['RUNNER_TEMP'])/'control.go'
          control.write_bytes(b'package p\nfunc f(){ if x := 1; x > 0 {} }\n')
          result=subprocess.run(['gofmt','-d',str(control)],text=True,capture_output=True)
          print('CONTROL RC',result.returncode,result.stdout,result.stderr)
          '@ | python
      - name: Trust package tests when present
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          if (Test-Path 'internal/adapters/trustfs') {
            go mod tidy
            go test ./internal/adapters/trustfs
          } else {
            Write-Host 'trustfs not introduced yet'
          }
