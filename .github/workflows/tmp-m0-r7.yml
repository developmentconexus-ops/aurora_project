name: Temporary M0 R7

on:
  push:
    branches:
      - feat/m0-r7-sovereign-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Canonicalize source and module lock
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          find cmd internal -name '*.go' -print0 | xargs -0 gofmt -w
          go mod tidy
          if ! git diff --quiet -- cmd internal go.mod go.sum; then
            git config user.name developmentconexus-ops
            git config user.email development.conexus@gmail.com
            git add cmd internal go.mod go.sum
            git commit -m "style(core): canonicalize R7 Go sources"
            git push origin HEAD:feat/m0-r7-sovereign-core
          fi
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/aurora" ./cmd/aurora
      - name: TASK-01 real binary continuity regression
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/aurora-task01"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" init > "$RUNNER_TEMP/t1-init.json" 2> "$RUNNER_TEMP/t1-init.err"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" status > "$RUNNER_TEMP/t1-status.json" 2> "$RUNNER_TEMP/t1-status.err"
          if printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" init > "$RUNNER_TEMP/t1-reinit.json" 2> "$RUNNER_TEMP/t1-reinit.err"; then
            echo 'second init unexpectedly succeeded' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          init=json.load(open(root+'/t1-init.json'))
          status=json.load(open(root+'/t1-status.json'))
          assert init['aurora_id'] == status['aurora_id']
          assert status['trust_state'] == 'NORMAL'
          assert status['governing_generation'] == 1
          PY
      - name: TASK-02 real binary Project continuity
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/aurora-task02"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" init > "$RUNNER_TEMP/t2-init.json"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" project create --label 'Projeto Fonte' --objective 'Construir fonte' > "$RUNNER_TEMP/t2-create.json"
          PROJECT_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/t2-create.json")"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" project show --project "$PROJECT_ID" > "$RUNNER_TEMP/t2-show.json"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" status > "$RUNNER_TEMP/t2-status.json"
          python - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          created=json.load(open(root+'/t2-create.json'))
          shown=json.load(open(root+'/t2-show.json'))
          status=json.load(open(root+'/t2-status.json'))
          assert created['project_id'] == shown['project_id']
          assert shown['display_label'] == 'Projeto Fonte'
          assert shown['objective_summary'] == 'Construir fonte'
          assert status['trust_state'] == 'NORMAL'
          assert status['governing_generation'] == 2
          print('TASK-02 real binary Project continuity: PASS')
          PY
      - name: TASK-07 fresh-process recovery proof
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/aurora-task07"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" init > "$RUNNER_TEMP/t7-init.json"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" project create --label 'Recovery' --objective 'Recover same state' > "$RUNNER_TEMP/t7-project.json"
          PROJECT_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/t7-project.json")"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" project set-state --project "$PROJECT_ID" --expected none --kind WORK_NOTE --summary R1 --payload '{}' --next-action BUILD > "$RUNNER_TEMP/t7-state.json"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" authority grant --project "$PROJECT_ID" --action BUILD > "$RUNNER_TEMP/t7-grant.json"
          printf 'fixture-owner-passphrase\n' | "$RUNNER_TEMP/aurora" --json --data-dir "$DATA_DIR" recover > "$RUNNER_TEMP/t7-recover.json"
          python - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          init=json.load(open(root+'/t7-init.json'))
          project=json.load(open(root+'/t7-project.json'))
          recovered=json.load(open(root+'/t7-recover.json'))
          assert recovered['status'] == 'RECOVERED', recovered
          assert recovered['trust_state'] == 'NORMAL', recovered
          assert recovered['aurora_id'] == init['aurora_id'], recovered
          assert recovered['authority_state_revision'] == 2, recovered
          assert len(recovered['projects']) == 1, recovered
          item=recovered['projects'][0]
          assert item['project_id'] == project['project_id'], item
          assert item['current_state_revision'] == 1, item
          assert item['next_safe_action']['decision'] == 'PERMITTED', item
          print('TASK-07 fresh-process recovery: PASS')
          PY
      - name: Secret hygiene regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F 'fixture-owner-passphrase' "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.err 2>/dev/null; then
            echo 'fixture passphrase leaked to journey output' >&2
            exit 1
          fi

  windows-trust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Trust classifications and filesystem tests
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/application ./internal/adapters/trustfs
