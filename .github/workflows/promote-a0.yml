name: Promote accepted A0 baseline

on:
  push:
    branches:
      - docs/architecture-baseline

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'docs: record operator A0 approval'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-baseline
          fetch-depth: 0

      - name: Promote approved A0 sources and decisions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path('.')
          ACCEPTANCE_ID = 'DOC-AURORA-A0-OPERATOR-ACCEPTANCE'
          ACCEPTED_AT = '2026-08-06'

          promote_paths = [
              Path('docs/DOCUMENTATION-MAP.md'),
              Path('docs/product/README.md'),
              Path('docs/product/CAPABILITY-REALIZATION-METHOD.md'),
              Path('docs/product/REQUIREMENTS-TRACEABILITY.md'),
              Path('docs/adr/README.md'),
              Path('docs/adr/0001-aurora-owned-contract-model.md'),
              Path('docs/adr/0002-first-party-harness-development-kit.md'),
              *sorted(Path('docs/product/blueprint').glob('[0-9][0-9]-*.md')),
          ]

          if len(list(Path('docs/product/blueprint').glob('[0-9][0-9]-*.md'))) != 15:
              raise SystemExit('expected exactly 15 Blueprint sections')

          def promote_frontmatter(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'{path}: missing frontmatter')
              marker = text.find('\n---\n', 4)
              if marker < 0:
                  raise SystemExit(f'{path}: unterminated frontmatter')
              fm = text[:marker + 1]
              body = text[marker + 1:]
              if re.search(r'(?m)^status: accepted$', fm):
                  return
              fm, count = re.subn(
                  r'(?m)^status: proposed$',
                  f'status: accepted\naccepted_at: {ACCEPTED_AT}\nacceptance_evidence: {ACCEPTANCE_ID}',
                  fm,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{path}: expected status: proposed in frontmatter')
              fm = re.sub(r'(?m)^last_reviewed: .*$', f'last_reviewed: {ACCEPTED_AT}', fm, count=1)
              path.write_text(fm + body, encoding='utf-8')

          for path in promote_paths:
              promote_frontmatter(path)

          # Requirements become accepted constitutional requirements, while mechanisms may remain open.
          req = Path('docs/product/REQUIREMENTS-TRACEABILITY.md')
          text = req.read_text(encoding='utf-8')
          text = text.replace(
              'This document converts the proposed Product Blueprint into explicit constitutional requirements.',
              'This document converts the accepted A0 Product Blueprint into explicit constitutional requirements.'
          )
          text = text.replace(
              'PROPOSED\n→ derived from proposed A0 Blueprint; not governing implementation yet',
              'ACCEPTED\n→ accepted A0 constitutional requirement; governs future applicability analysis but does not itself authorize implementation'
          )
          req.write_text(text, encoding='utf-8')

          # Mark the A0 completion checklist in the accepted realization method.
          acrm = Path('docs/product/CAPABILITY-REALIZATION-METHOD.md')
          text = acrm.read_text(encoding='utf-8')
          if '## 25. A0 acceptance checklist' in text:
              before, after = text.split('## 25. A0 acceptance checklist', 1)
              checklist, *rest = after.split('\n---\n', 1)
              checklist = checklist.replace('- [ ]', '- [x]')
              text = before + '## 25. A0 acceptance checklist' + checklist
              if rest:
                  text += '\n---\n' + rest[0]
          acrm.write_text(text, encoding='utf-8')

          # Product index now reflects operator acceptance while preserving implementation gates.
          product_index = Path('docs/product/README.md')
          text = product_index.read_text(encoding='utf-8')
          text = text.replace(
              'All constitutional sources in PR #1 remain `proposed` until explicit operator acceptance and merge.',
              'All A0 constitutional sources were explicitly accepted by the operator on 2026-08-06. Merge is a separate repository action and was authorized by the same operator decision.'
          )
          old_block = '''A0 documentation/research work: AUTHORIZED\nA0 content: IN_REVIEW\nADRs: PROPOSED\nArchitecture Spikes: NOT AUTHORIZED\nAurora runtime implementation: PROHIBITED\nAHDK implementation: PROHIBITED\nMNFS integration: PROHIBITED'''
          new_block = '''A0 baseline: ACCEPTED\nConstitutional sources: ACCEPTED\nADR-0001 / ADR-0002: ACCEPTED\nPR #1 merge: AUTHORIZED\nArchitecture Spikes: NOT AUTHORIZED\nAurora runtime implementation: PROHIBITED\nAHDK implementation: PROHIBITED\nMNFS integration: PROHIBITED'''
          if old_block not in text:
              raise SystemExit('product index authority block changed unexpectedly')
          product_index.write_text(text.replace(old_block, new_block), encoding='utf-8')

          # ADR index mirrors the explicit lifecycle decisions.
          adr_index = Path('docs/adr/README.md')
          text = adr_index.read_text(encoding='utf-8')
          text = re.sub(r'(\| \[0001\][^\n]*\|) proposed (\|)', r'\1 accepted \2', text)
          text = re.sub(r'(\| \[0002\][^\n]*\|) proposed (\|)', r'\1 accepted \2', text)
          adr_index.write_text(text, encoding='utf-8')

          # Tracking decision index: all D-* decisions in the accepted A0 baseline are now accepted.
          decisions = Path('docs/tracking/DECISIONS.md')
          text = decisions.read_text(encoding='utf-8')
          lines = []
          for line in text.splitlines():
              if line.startswith('| D-') and line.rstrip().endswith('| proposed |'):
                  line = line[:-len('| proposed |')] + '| accepted |'
              lines.append(line)
          decisions.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Independent Golden Proof remains evidence; operator verdict now closes the human gate.
          evaluation = Path('docs/acceptance/2026-08-06-gp-a0-fresh-001-evaluation.md')
          text = evaluation.read_text(encoding='utf-8')
          text = text.replace('operator_verdict: PENDING', 'operator_verdict: ACCEPTED', 1)
          text += '''\n\n## 9. Operator verdict\n\nOn 2026-08-06, after reviewing the A0 reading package, Leandro explicitly approved all four pending decisions and stated that the idea is well structured.\n\n```text\nA0 baseline: ACCEPTED\nADR-0001: ACCEPTED\nADR-0002: ACCEPTED\nPR #1 merge: AUTHORIZED\n```\n\nThis approval does not authorize runtime implementation, Architecture Spike execution, AHDK implementation, MNFS integration or a stack choice. The next product gate is first Product Milestone selection followed by ACRM R0.\n'''
          evaluation.write_text(text, encoding='utf-8')

          acceptance_index = Path('docs/acceptance/README.md')
          text = acceptance_index.read_text(encoding='utf-8')
          text = text.replace(
              'Protocol ready\nAuthoring-session dry run non-qualifying\nIndependent execution pending\nOperator verdict pending',
              'Protocol ready\nAuthoring-session dry run non-qualifying\nIndependent execution PASS — GP-A0-FRESH-001, 100/100, zero hard failures\nOperator verdict ACCEPTED — 2026-08-06'
          )
          if '2026-08-06-gp-a0-fresh-001-evaluation.md' not in text:
              text = text.replace(
                  '- [A0 Fresh-Session Documentation Golden Proof](2026-08-06-a0-fresh-session-golden-proof.md)',
                  '- [A0 Fresh-Session Documentation Golden Proof](2026-08-06-a0-fresh-session-golden-proof.md)\n- [GP-A0-FRESH-001 Evaluation](2026-08-06-gp-a0-fresh-001-evaluation.md)\n- [A0 Operator Acceptance](2026-08-06-a0-operator-acceptance.md)'
              )
          acceptance_index.write_text(text, encoding='utf-8')

          # Fresh-session bootstrap reflects the accepted baseline without implying implementation authority.
          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          old = '''Phase: A0 — Product, Discovery and Architecture Baseline\nWorking branch: docs/architecture-baseline\nDraft PR: #1\nA0 content: IN REVIEW / REMEDIATION\nAurora Core implementation: PROHIBITED\nAHDK implementation: PROHIBITED\nArchitecture Spikes: PROPOSED, NOT AUTHORIZED\nStack selection: NOT PERFORMED\nMNFS integration: PROHIBITED\nAutomatic merge: NOT AUTHORIZED'''
          new = '''Phase: A0 — ACCEPTED Product, Discovery and Architecture Baseline\nRepository disposition: PR #1 merge AUTHORIZED; consult STATUS for completion\nA0 constitutional content: ACCEPTED\nADR-0001 / ADR-0002: ACCEPTED\nFirst Product Milestone: NOT YET SELECTED\nAurora Core implementation: PROHIBITED\nAHDK implementation: PROHIBITED\nArchitecture Spikes: PROPOSED, NOT AUTHORIZED\nStack selection: NOT PERFORMED\nMNFS integration: PROHIBITED'''
          if old not in text:
              raise SystemExit('AGENTS current-phase block changed unexpectedly')
          text = text.replace(old, new)
          text = text.replace(
              'Documentation, research, adversarial review and validation are authorized.',
              'A0 is accepted. Product Milestone selection and ACRM R0 preparation are authorized next; implementation remains prohibited until the applicable gates and a separate execution authorization pass.'
          )
          agents.write_text(text, encoding='utf-8')

          # Root README reflects accepted product constitution and the correct next gate.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''Phase: A0 — Product, Discovery and Architecture Baseline\nBranch: docs/architecture-baseline\nDraft PR: #1\nRuntime implementation: PROHIBITED\nArchitecture Spikes: NOT AUTHORIZED\nStack selection: NOT PERFORMED'''
          new = '''A0 baseline: ACCEPTED — 2026-08-06\nADR-0001 / ADR-0002: ACCEPTED\nNext product gate: select first Product Milestone → begin ACRM R0\nRuntime implementation: PROHIBITED\nArchitecture Spikes: NOT AUTHORIZED\nStack selection: NOT PERFORMED'''
          if old not in text:
              raise SystemExit('README state block changed unexpectedly')
          text = text.replace(old, new)
          text = text.replace(
              'A0 está reconstruindo e validando a base documental completa. A existência de arquivos não significa aceitação nem autorização para implementar.',
              'A0 foi explicitamente aceita pelo operador após validação mecânica, revisão adversarial e Golden Proof independente. Essa aceitação estabelece a constituição do produto; não autoriza implementação. O próximo passo é selecionar o primeiro Product Milestone e iniciar ACRM R0.'
          )
          readme.write_text(text, encoding='utf-8')

          # Replace tracking status with the exact pre-merge operator-decision state.
          status = Path('docs/tracking/STATUS.md')
          status.write_text('''---\nid: DOC-AURORA-STATUS\ntitle: Aurora Project Status\ndocument_type: project_status\nform: reference\nauthority: tracking\nstatus: current\nversion: 0.6.0\nowners:\n  - developmentconexus-ops\nsource_of_truth_for:\n  - current Aurora project phase\n  - current authorization boundary\n  - current blockers and immediate next action\nrelated:\n  - DOC-AURORA-DOCUMENTATION-MAP\n  - DOC-AURORA-PRODUCT-INDEX\n  - DOC-AURORA-ROADMAP\n  - DOC-AURORA-CAPABILITY-REALIZATION-METHOD\n  - DOC-AURORA-A0-OPERATOR-ACCEPTANCE\n  - DOC-AURORA-GP-A0-FRESH-001-EVALUATION\nlast_reviewed: 2026-08-06\n---\n\n# Aurora Project Status\n\n## 1. Current summary\n\n- **Project:** Projeto Aurora\n- **Phase:** A0 — ACCEPTED Product, Discovery and Architecture Baseline\n- **A0 accepted:** 2026-08-06 by operator\n- **Product Blueprint:** 15 modular accepted constitutional sections plus generated aggregate\n- **Constitutional requirements:** 294 accepted A0 requirements\n- **ADR-0001:** ACCEPTED\n- **ADR-0002:** ACCEPTED\n- **Independent Fresh-Session Golden Proof:** PASS — 100/100, zero hard failures\n- **PR #1:** merge explicitly AUTHORIZED; pending repository merge at this tracking revision\n- **First Product Milestone:** not yet selected\n- **Stack decisions:** none\n- **Runtime implementation:** not started and not authorized\n\n## 2. Operator decision\n\nThe operator reviewed the required A0 package and explicitly approved all pending decisions, stating that the idea is well structured.\n\n```text\nA0 baseline: ACCEPTED\nADR-0001: ACCEPTED\nADR-0002: ACCEPTED\nPR #1 merge: AUTHORIZED\n```\n\nEvidence: `docs/acceptance/2026-08-06-a0-operator-acceptance.md`.\n\n## 3. Current authorization boundary\n\n```text\nA0 baseline:                    ACCEPTED\nADR-0001 / ADR-0002:           ACCEPTED\nPR #1 merge:                   AUTHORIZED / PENDING\nFirst Product Milestone choice: AUTHORIZED / NOT YET MADE\nACRM R0:                        NOT STARTED; begins after milestone selection\nArchitecture Spike planning:    NOT STARTED\nArchitecture Spike execution:   PROHIBITED\nCapability implementation:      PROHIBITED\nAurora Core implementation:     PROHIBITED\nAHDK implementation:            PROHIBITED\nMNFS integration:               PROHIBITED\nStack selection:                NOT PERFORMED\n```\n\nA0 acceptance does not skip any ACRM gate. No runtime work is authorized by implication.\n\n## 4. Deliberately open technical decisions\n\n- Aurora Core language and deployment shape;\n- first AHDK language/toolchain;\n- schema representation per boundary;\n- local RPC binding;\n- exact MCP/A2A mapping;\n- durable execution engine;\n- policy engine;\n- workload/device identity mechanism;\n- operational state/event storage;\n- Artifact/Evidence Store;\n- event transport and telemetry backend;\n- memory mechanism mix;\n- first reference Harness runtime;\n- first real engineering Harness;\n- first Product Milestone and Mission Contract.\n\nThese remain future ACRM R3/R4 decisions unless the selected milestone requires them earlier through an explicit gate.\n\n## 5. Immediate next action\n\n```text\ncomplete authorized merge of PR #1\n→ select the first Product Milestone\n→ begin ACRM R0 — Constitutional Baseline for that milestone\n```\n\nThe next action is not implementation.\n''', encoding='utf-8')

          # Append immutable worklog entry.
          worklog = Path('docs/tracking/WORKLOG.md')
          text = worklog.read_text(encoding='utf-8').rstrip()
          text += '''\n\n## 2026-08-06 — A0 operator acceptance\n\nAfter the independent Fresh-Session Golden Proof passed 100/100 with zero hard failures, Leandro reviewed the A0 authorization reading package and explicitly approved all pending decisions, stating that the idea is well structured.\n\nDecisions:\n\n- A0 Product/Discovery/Architecture baseline: ACCEPTED;\n- ADR-0001: ACCEPTED;\n- ADR-0002: ACCEPTED;\n- PR #1 merge: AUTHORIZED.\n\nThe decision was recorded in `docs/acceptance/2026-08-06-a0-operator-acceptance.md`. Architecture Spikes and all runtime/AHDK/MNFS implementation remain prohibited. The next product step after repository merge is to select the first Product Milestone and begin ACRM R0.\n'''
          worklog.write_text(text + '\n', encoding='utf-8')

          # Regenerate read-only projections after constitutional source lifecycle promotion.
          subprocess.run(['python', 'scripts/generate_docs.py'], check=True)

          # One-time promotion workflow removes itself from the resulting commit.
          Path('.github/workflows/promote-a0.yml').unlink()
          PY

      - name: Commit accepted A0 state
        run: |
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: promote accepted A0 baseline and ADRs"
          git push origin HEAD:docs/architecture-baseline
