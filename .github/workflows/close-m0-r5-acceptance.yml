name: Close M0 R5 Acceptance

on:
  push:
    branches:
      - docs/m0-r5-acceptance-closeout
    paths:
      - ".github/workflows/close-m0-r5-acceptance.yml"
      - "scripts/tmp_patch_close_m0_r5.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r5-acceptance-closeout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch closeout helper
        run: python scripts/tmp_patch_close_m0_r5.py

      - name: Apply exact R5 acceptance promotion and rerun review
        run: python scripts/tmp_close_m0_r5.py

      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"

      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"

      - name: Verify R5 PASS and stop boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          acceptance = 'DOC-AURORA-M0-R5-A2-CONTRACT-OPERATOR-ACCEPTANCE'
          expected = {
              'docs/capabilities/CAP-SOVEREIGN-CORE/REQUIREMENTS.md': ('0.1.1', 'de234e4a57c04d1d0b68cd017597e06a618fd68b'),
              'docs/capabilities/CAP-SOVEREIGN-CORE/SPEC.md': ('0.2.0', 'dd6f66c23c08fc635d780aac5e70533a82e72a75'),
              'docs/capabilities/CAP-SOVEREIGN-CORE/THREAT-MODEL.md': ('0.2.0', '7e97f816d0c4966ba6b12cf0447c7a2210fbea34'),
              'docs/capabilities/CAP-SOVEREIGN-CORE/TEST-PLAN.md': ('0.2.0', '8b42cc451439038e63e8b567702877b8951c5edb'),
              'docs/capabilities/CAP-SOVEREIGN-CORE/MIS-M0-SOVEREIGN-CORE-001.md': ('0.1.0', '1db39012874828f54f293bf76571259494ba5a79'),
          }
          for path, (version, blob) in expected.items():
              text = Path(path).read_text(encoding='utf-8')
              required = [
                  'status: accepted',
                  f'version: {version}',
                  'accepted_at: 2026-08-09',
                  f'acceptance_evidence: {acceptance}',
                  f'accepted_from_blob: {blob}',
              ]
              for needle in required:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle}')
              if 'status: proposed' in text.split('\n---\n', 1)[0]:
                  raise SystemExit(f'{path}: frontmatter still proposed')

          coverage = Path('docs/capabilities/CAP-SOVEREIGN-CORE/R5-COVERAGE.md').read_text(encoding='utf-8')
          rows = re.findall(r'^\| `CAP-SOVEREIGN-CORE-REQ-(\d{3})` \| `MIS-M0-SOVEREIGN-CORE-001-CRIT-(\d{3})` \|', coverage, re.M)
          if len(rows) != 122 or len({r[0] for r in rows}) != 122:
              raise SystemExit(f'R5 requirement allocation invalid: {len(rows)} rows')

          contract = Path('docs/capabilities/CAP-SOVEREIGN-CORE/MIS-M0-SOVEREIGN-CORE-001.md').read_text(encoding='utf-8')
          criteria = re.findall(r'^### `MIS-M0-SOVEREIGN-CORE-001-CRIT-(\d{3})`', contract, re.M)
          if criteria != [f'{i:03d}' for i in range(1, 13)]:
              raise SystemExit(f'Mission criteria mismatch: {criteria}')
          if 'Status:           APPROVED' not in contract:
              raise SystemExit('Mission body does not report APPROVED lifecycle')

          review = Path('docs/reviews/2026-08-09-m0-r5-contract-readiness-rerun.md').read_text(encoding='utf-8')
          for needle in ['R5 PASS', 'R6 NOT AUTHORIZED', '122/122', '12 Mission criteria']:
              if needle not in review:
                  raise SystemExit(f'R5 rerun review missing {needle}')

          status = Path('docs/tracking/STATUS.md').read_text(encoding='utf-8')
          required_status = [
              'ACRM R5 — Contract Readiness:    PASS — exact A2 package + Mission Contract accepted/approved',
              'ACRM R6+:                       NOT AUTHORIZED',
              'Aurora Core implementation:     PROHIBITED',
              'Mission Contract:               APPROVED — MIS-M0-SOVEREIGN-CORE-001 v0.1.0',
              'R5 PASS\n→ STOP\n→ await explicit operator authorization for M0 ACRM R6 — Implementation Design Readiness',
          ]
          for needle in required_status:
              if needle not in status:
                  raise SystemExit(f'STATUS boundary missing: {needle}')

          decisions = Path('docs/tracking/DECISIONS.md').read_text(encoding='utf-8')
          if '| D-057 |' not in decisions or '| D-058 |' not in decisions:
              raise SystemExit('accepted A2/Contract decisions missing')
          if '| O-015 |' in decisions:
              raise SystemExit('O-015 still open after exact Mission approval')

          print('R5 final gate: PASS candidate; exact A2/Contract lifecycle accepted; 122/122 allocation; R6 prohibited')
          PY
          git diff --check

      - name: Commit docs-only R5 PASS closeout and remove helpers
        shell: bash
        run: |
          rm .github/workflows/close-m0-r5-acceptance.yml
          rm scripts/tmp_close_m0_r5.py
          rm scripts/tmp_patch_close_m0_r5.py

          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add docs .github/workflows/close-m0-r5-acceptance.yml scripts/tmp_close_m0_r5.py scripts/tmp_patch_close_m0_r5.py
          git diff --cached --check

          bad="$(git diff --cached --name-status | awk '$1 != "D" && $2 !~ /^docs\// {print}')"
          if [[ -n "$bad" ]]; then
            echo "non-doc permanent R5 closeout diff detected:" >&2
            echo "$bad" >&2
            exit 1
          fi

          git commit -m 'docs: accept M0 A2 contract package and close R5 PASS'
          git push origin HEAD:docs/m0-r5-acceptance-closeout
