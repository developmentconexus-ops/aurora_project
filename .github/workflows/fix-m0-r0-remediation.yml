name: Remediate M0 R0 constitutional baseline

on:
  push:
    branches:
      - docs/architecture-baseline
    paths:
      - docs/acceptance/2026-08-06-m0-r0-remediation-authorization.md

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-baseline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply R0 documentary remediation
        run: python scripts/fix_m0_r0_remediation.py

      - name: Generate documentation projections
        run: |
          python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
          cp "$RUNNER_TEMP/aurora-generated/docs/product/PRODUCT-BLUEPRINT.md" docs/product/PRODUCT-BLUEPRINT.md
          cp "$RUNNER_TEMP/aurora-generated/docs/roadmap.md" docs/roadmap.md

      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"

      - name: Verify generated projections are current
        run: python scripts/generate_docs.py --check

      - name: Commit validated remediation
        run: |
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: remediate M0 R0 constitutional baseline"
          git push origin HEAD:docs/architecture-baseline
