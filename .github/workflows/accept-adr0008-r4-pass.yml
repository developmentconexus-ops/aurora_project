name: Accept ADR-0008 and Close M0 R4

on:
  push:
    branches:
      - docs/m0-r4-adr0008-acceptance-r4-pass
    paths:
      - ".github/workflows/accept-adr0008-r4-pass.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r4-adr0008-acceptance-r4-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accepted ADR and R4 PASS state
        run: python scripts/tmp_accept_adr0008_r4_pass.py
      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
      - name: Verify final R4 boundary
        shell: bash
        run: |
          grep -F 'status: accepted' docs/adr/0008-m0-owner-root-recovery-trust.md
          grep -F 'acceptance_evidence: DOC-AURORA-M0-R4-ADR0008-ACCEPTANCE' docs/adr/0008-m0-owner-root-recovery-trust.md
          grep -F 'M0 ACRM R4 — Architecture/Decision Readiness: PASS' docs/tracking/STATUS.md
          grep -F 'R5 — Contract Readiness:** NOT AUTHORIZED' docs/tracking/STATUS.md || grep -F 'R5 — Contract Readiness:** NOT AUTHORIZED' docs/tracking/STATUS.md || grep -F 'R5 — Contract Readiness:    NOT AUTHORIZED' docs/tracking/STATUS.md
          grep -F 'R4 PASS' docs/reviews/2026-08-07-m0-r4-architecture-decision-readiness-rerun.md
          grep -F 'R5 NOT AUTHORIZED' docs/reviews/2026-08-07-m0-r4-architecture-decision-readiness-rerun.md
          test ! -d spikes/m0-owner-trust-002
          git diff --check
      - name: Commit validated docs-only closeout and remove helpers
        shell: bash
        run: |
          rm .github/workflows/accept-adr0008-r4-pass.yml
          rm scripts/tmp_accept_adr0008_r4_pass.py
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add docs .github/workflows/accept-adr0008-r4-pass.yml scripts/tmp_accept_adr0008_r4_pass.py
          git diff --cached --check
          git commit -m 'docs: accept ADR-0008 and close M0 R4 PASS'
          git push origin HEAD:docs/m0-r4-adr0008-acceptance-r4-pass
