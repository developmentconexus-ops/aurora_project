name: RM-08 Platform Enforcement

on:
  push:
    branches:
      - docs/mr-01-repository-migration-20260823
    paths:
      - .github/workflows/rm08-platform-enforcement.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rm08-platform-enforcement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    if: github.head_ref == '' || github.head_ref == 'docs/mr-01-repository-migration-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Protect main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["validate"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": false,
            "block_creations": false,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON
          curl --fail-with-body -sS -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/branches/main/protection" \
            --data-binary @/tmp/protection.json

      - name: Set repository merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}" \
            -d '{"allow_squash_merge":true,"allow_merge_commit":false,"allow_rebase_merge":false,"delete_branch_on_merge":true}'
