name: MR-01 Repository Migration

on:
  push:
    branches:
      - docs/mr-01-repository-migration-20260823
    paths:
      - scripts/mr01_migrate.py
      - .github/workflows/mr01-migrate.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/mr01_migrate.py
      - .github/workflows/mr01-migrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == '' || github.head_ref == 'docs/mr-01-repository-migration-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: docs/mr-01-repository-migration-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch staged migrator bootstrap
        run: sed -i '/^import subprocess$/a import sys' scripts/mr01_migrate.py

      - name: Execute ratified migration
        run: python scripts/mr01_migrate.py

      - name: Verify one-shot transformation removed temporary tooling in workspace
        run: |
          test ! -e scripts/mr01_migrate.py
          test ! -e .github/workflows/mr01-migrate.yml

      - name: Restore workflow files for token-safe publication
        run: |
          git checkout HEAD -- .github/workflows/docs.yml
          git checkout HEAD -- .github/workflows/mr01-migrate.yml

      - name: Commit repository migration excluding workflow mutations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration produced no changes" >&2
            exit 1
          fi
          git commit -m "docs(mr-01): apply repository control-plane migration"
          git push origin HEAD:docs/mr-01-repository-migration-20260823
