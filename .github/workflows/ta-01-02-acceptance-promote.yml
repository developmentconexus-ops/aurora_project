name: Record TA-01/TA-02 Operator Acceptance

on:
  push:
    branches:
      - docs/ta-01-02-module-runtime-topology-20260812
    paths:
      - .github/workflows/ta-01-02-acceptance-promote.yml

permissions:
  contents: write

jobs:
  record-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/ta-01-02-module-runtime-topology-20260812
          fetch-depth: 0

      - name: Record accepted lifecycle and continuity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          fixed = "965211ad421f13994285031bbcf04b7e943cf75e"
          evidence = "DOC-AURORA-TA-01-02-OPERATOR-ACCEPTANCE"
          acceptance_b64 = ""
          worklog_b64 = ""

          Path("docs/acceptance/2026-08-13-ta-01-02-operator-acceptance.md").write_bytes(base64.b64decode(acceptance_b64))

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          design = "docs/design/AURORA-TA-01-02-MODULE-RUNTIME-TOPOLOGY.md"
          replace_one(design, "status: proposed\nversion: 0.5.0", f"status: accepted\naccepted_at: 2026-08-13\nacceptance_evidence: {evidence}\naccepted_from_commit: {fixed}\nversion: 0.5.0")
          for a,b in [
              ("  - proposed minimum coherent Aurora technical component set", "  - accepted minimum coherent Aurora technical component set"),
              ("  - proposed canonical module and entity ownership for TA-01", "  - accepted canonical module and entity ownership for TA-01"),
              ("  - proposed Stage A process and runtime topology for TA-02", "  - accepted Stage A process and runtime topology for TA-02"),
              ("  - proposed Stage B evolutionary topology and process split triggers", "  - accepted Stage B evolutionary topology and process split triggers"),
              ("  - proposed transport-neutral provider runtime boundary profile", "  - accepted transport-neutral provider runtime boundary profile"),
              ("  - proposed TA-01 and TA-02 decision disposition register", "  - accepted TA-01 and TA-02 decision disposition register"),
              ("The design remains **proposed** until operator acceptance. It does not authorize implementation, TA-03 finalization, Architecture Spike execution, M0 R7 continuation or M0 R8.", "The design is **operator accepted for canonical promotion** through `DOC-AURORA-TA-01-02-OPERATOR-ACCEPTANCE`. Acceptance does not authorize implementation, TA-03 finalization, Architecture Spike execution, M0 R7 continuation, M0 R8 or merge by implication."),
              ("Until acceptance:\n\n```text\nproposal NON-CANONICAL\nTA-03/04/05/08 finalization BLOCKED\nSpikes NOT AUTHORIZED\nimplementation PAUSED\n```", "After operator acceptance and before canonical merge:\n\n```text\ndesign ACCEPTED / PROMOTION PENDING\nPR #5 MERGE REQUIRES SEPARATE AUTHORIZATION\nTA-03/04/05/08 finalization BLOCKED\nSpikes NOT AUTHORIZED\nimplementation PAUSED\n```")]:
              replace_one(design, a, b)

          status = "docs/tracking/STATUS.md"
          for a,b in [
              ("version: 0.35.0", "version: 0.36.0"),
              ("last_reviewed: 2026-08-12", "last_reviewed: 2026-08-13"),
              ("  - REVIEW-AURORA-TA-01-02-MODULE-RUNTIME-TOPOLOGY-2026-08-12\n", "  - REVIEW-AURORA-TA-01-02-MODULE-RUNTIME-TOPOLOGY-2026-08-12\n  - DOC-AURORA-TA-01-02-OPERATOR-ACCEPTANCE\n"),
              ("- **TA-01/TA-02 design:** PROPOSED v0.5.0", "- **TA-01/TA-02 design:** OPERATOR ACCEPTED v0.5.0 / PROMOTION PENDING"),
              ("- **Adversarial semantic review:** PASS FOR OPERATOR REVIEW", "- **Adversarial semantic review:** PASS / OPERATOR ACCEPTED"),
              ("status: proposed\n\nreview:", f"status: accepted\nacceptance evidence: docs/acceptance/2026-08-13-ta-01-02-operator-acceptance.md\naccepted from semantic commit: {fixed}\n\nreview:"),
              ("The package remains non-canonical until explicit operator acceptance and a separate merge/promotion authorization.", "The package is operator accepted but remains non-canonical until a separate explicit merge/promotion authorization."),
              ("- operator review of the fixed TA-01/TA-02 package and PR #5;\n- exact documentary corrections requested by the operator;\n- final normal documentation validation;\n- acceptance/promotion evidence preparation only after an explicit operator decision.", "- lifecycle promotion and validation of the operator-accepted TA-01/TA-02 package;\n- preparation of canonical merge/promotion evidence;\n- exact documentary corrections needed to preserve the accepted semantics;\n- requesting a separate explicit merge/promotion decision."),
              ("TA-01/TA-02 OPERATOR DECISION: PENDING", "TA-01/TA-02 OPERATOR DECISION: ACCEPTED"),
              ("final normal Documentation validation\n→ present Approach C + G01/C01–C12 + A05 + B01 to operator\n→ operator: ACCEPT | REVISE | REJECT\n→ STOP before merge, later-tranche finalization,\n  Architecture Spike execution or implementation", "validate accepted-lifecycle promotion\n→ prepare fixed merge/promotion evidence\n→ request separate explicit merge authorization\n→ STOP before merge, later-tranche finalization,\n  Architecture Spike execution or implementation"),
              ("ACCEPT\n→ accept the TA-01/TA-02 semantic design for canonical promotion only\n→ merge still requires separate explicit promotion authorization\n\nREVISE\n→ return exact ownership/topology/lifecycle changes\n→ implementation remains paused\n\nREJECT\n→ preserve the accepted Technical Architecture Map\n→ replace this proposal through another reviewed TA-01/TA-02 design", "OPERATOR ACCEPTED\n→ TA-01/TA-02 v0.5.0 is accepted for canonical promotion\n→ merge still requires separate explicit promotion authorization\n\nNEXT DECISION\n→ AUTHORIZE MERGE | HOLD PROMOTION\n→ implementation remains paused either way")]:
              replace_one(status, a, b)

          decisions = "docs/tracking/DECISIONS.md"
          for a,b in [
              ("version: 0.8.0", "version: 0.9.0"),
              ("last_reviewed: 2026-08-12", "last_reviewed: 2026-08-13"),
              ("  - PLAN-AURORA-TECHNICAL-ARCHITECTURE-BASELINE\n", "  - PLAN-AURORA-TECHNICAL-ARCHITECTURE-BASELINE\n  - DESIGN-AURORA-TA-01-02-MODULE-RUNTIME-TOPOLOGY\n  - DOC-AURORA-TA-01-02-OPERATOR-ACCEPTANCE\n"),
              ("| D-069 | the current active architecture tranche is TA-01 + TA-02, producing module ownership and Stage A/B process/runtime topology before repository or stack finalization | Technical Architecture Map + operator acceptance + STATUS | active/authorized |", "| D-069 | TA-01 + TA-02 is the accepted first Technical Architecture tranche, fixing module ownership and Stage A/B runtime-topology direction before repository or stack finalization | TA-01/TA-02 design + operator acceptance | accepted |\n| D-070 | canonical ownership is G01 Contract Model Governance plus C01–C12 domain owners, including C03 Intent ownership and C12 Audit/Exact History | TA-01/TA-02 design v0.5.0 + operator acceptance | accepted |\n| D-071 | Stage A uses Approach C: one small persistent Evolutionary Sovereign Host plus a separate on-demand provider-runtime seam at the first consumer; other process splits require evidence | TA-01/TA-02 design v0.5.0 + operator acceptance | accepted |\n| D-072 | A05 owns Aurora-side runtime lifecycle policy and B01 owns transport-neutral provider identity/lifecycle/idempotency/cancellation/reconciliation semantics before TA-04 selects a binding | TA-01/TA-02 design v0.5.0 + operator acceptance | accepted |")]:
              replace_one(decisions, a, b)
          for row in ["| O-015 | global logical module ownership and allowed dependency direction | TA-01 design and owning Specs/ADRs if material |\n", "| O-021 | minimum coherent technical component set and canonical owner for each global concept | TA-01 current tranche |\n", "| O-022 | Stage A same-process/separate-process boundaries and Stage B evolution | TA-02 current tranche |\n"]:
              replace_one(decisions, row, "")

          worklog = Path("docs/tracking/WORKLOG.md")
          w = worklog.read_text(encoding="utf-8")
          if "version: 0.16.0" not in w:
              raise SystemExit("WORKLOG 0.16.0 anchor missing")
          w = w.replace("version: 0.16.0", "version: 0.17.0", 1).replace("last_reviewed: 2026-08-12", "last_reviewed: 2026-08-13", 1)
          entry = base64.b64decode(worklog_b64).decode("utf-8")
          if "## 2026-08-13 — TA-01/TA-02 operator acceptance" not in w:
              w = w.rstrip() + "\n\n" + entry.rstrip() + "\n"
          worklog.write_text(w, encoding="utf-8")

          Path(".github/workflows/ta-01-02-acceptance-promote.yml").unlink()
          PY

      - name: Commit acceptance record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(architecture): record TA-01 and TA-02 operator acceptance"
          git push origin HEAD:docs/ta-01-02-module-runtime-topology-20260812