name: Append Final TA-01/TA-02 Continuity

on:
  push:
    branches:
      - docs/ta-01-02-module-runtime-topology-20260812
    paths:
      - .github/workflows/ta-final-continuity.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/ta-01-02-module-runtime-topology-20260812
          fetch-depth: 0

      - name: Clean design and append Worklog
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          design = Path('docs/design/AURORA-TA-01-02-MODULE-RUNTIME-TOPOLOGY.md')
          text = design.read_text(encoding='utf-8')
          text = text.replace('│ C03 Intent, Mission & Delegation Control                              │', '│ C03 Intent, Mission & Delegation Control                      │', 1)
          text = text.replace('| C03 | Host when implemented | durable/multi-node need |\n', '', 1)
          design.write_text(text, encoding='utf-8')

          worklog = Path('docs/tracking/WORKLOG.md')
          w = worklog.read_text(encoding='utf-8')
          heading = '## 2026-08-12 — TA-01/TA-02 final reviewer remediation'
          if heading not in w:
              old = 'version: 0.15.0'
              if old not in w:
                  raise SystemExit('expected WORKLOG version 0.15.0 not found')
              w = w.replace(old, 'version: 0.16.0', 1)
              entry = base64.b64decode('').decode('utf-8')
              worklog.write_text(w.rstrip() + '\n\n' + entry.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit continuity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/AURORA-TA-01-02-MODULE-RUNTIME-TOPOLOGY.md docs/tracking/WORKLOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: close final TA-01 and TA-02 continuity"
          git push origin HEAD:docs/ta-01-02-module-runtime-topology-20260812
