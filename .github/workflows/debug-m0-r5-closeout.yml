name: Debug M0 R5 Closeout

on:
  push:
    branches:
      - docs/m0-r5-acceptance-closeout
    paths:
      - ".github/workflows/debug-m0-r5-closeout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r5-acceptance-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact helper failure
        shell: bash
        run: |
          set +e
          python scripts/tmp_patch_close_m0_r5.py > /tmp/patch.log 2>&1
          patch_rc=$?
          if [[ $patch_rc -eq 0 ]]; then
            python scripts/tmp_close_m0_r5.py > /tmp/close.log 2>&1
            close_rc=$?
          else
            close_rc=99
          fi
          {
            echo "patch_rc=$patch_rc"
            echo "close_rc=$close_rc"
            echo "--- patch ---"
            cat /tmp/patch.log
            echo "--- close ---"
            cat /tmp/close.log 2>/dev/null || true
          } > r5-close-error.txt
          cat r5-close-error.txt
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add r5-close-error.txt
          git commit -m 'chore: capture R5 closeout error' || true
          git push origin HEAD:docs/m0-r5-acceptance-closeout
