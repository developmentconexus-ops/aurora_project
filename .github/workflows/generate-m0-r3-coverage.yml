name: Generate M0 R3 coverage

on:
  push:
    branches:
      - docs/m0-r3-capability-readiness
    paths:
      - ".github/m0-r3-coverage.trigger"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate R3 requirement coverage
        run: python scripts/generate_m0_r3_coverage.py

      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"

      - name: Validate documentation system
        run: python scripts/validate_docs.py --generated-root "$RUNNER_TEMP/aurora-generated" --report "$RUNNER_TEMP/docs-validation-report.json"

      - name: Check generated projections
        run: python scripts/generate_docs.py --check

      - name: Commit coverage and remove one-shot helper
        run: |
          rm -f scripts/generate_m0_r3_coverage.py .github/workflows/generate-m0-r3-coverage.yml .github/m0-r3-coverage.trigger
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add M0 R3 requirement allocation"
          git push origin HEAD:docs/m0-r3-capability-readiness
