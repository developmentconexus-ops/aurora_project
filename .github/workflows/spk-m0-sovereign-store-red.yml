name: SPK-001 Initial RED

on:
  push:
    branches:
      - spike/m0-sovereign-store-001
    paths:
      - "spikes/m0-sovereign-store-001/**"
      - ".github/workflows/spk-m0-sovereign-store-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/m0-sovereign-store-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Verify contract fails before implementation
        shell: bash
        run: |
          set +e
          output="$(go test ./... 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected RED test failure, but tests passed"
            exit 1
          fi
          printf '%s\n' "$output" | grep -E 'undefined: (Bootstrap|Inspect)'
          echo "RED confirmed: durable store contract is not implemented yet"
