name: Promote accepted M0 R0 remediation

on:
  push:
    branches:
      - docs/architecture-baseline
    paths:
      - docs/acceptance/2026-08-07-m0-r0-remediation-operator-acceptance.md

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-baseline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved semantic revision did not drift
        run: |
          git diff --exit-code b32cfe134f84eed3797d866e607c92c227514186 HEAD -- \
            AGENTS.md \
            CONTRIBUTING.md \
            README.md \
            docs/DOCUMENTATION-MAP.md \
            docs/adr/README.md \
            docs/product/README.md \
            docs/product/REQUIREMENTS-TRACEABILITY.md \
            docs/product/blueprint/01-product-vision.md \
            docs/product/blueprint/14-capability-roadmap.md \
            docs/product/blueprint/15-documentation-research-governance.md \
            docs/reviews/2026-08-06-m0-r0-constitutional-baseline-review.md \
            docs/tracking/DOCUMENTATION-COVERAGE.md

      - name: Promote accepted revision lifecycle
        run: python scripts/promote_m0_r0_remediation.py

      - name: Generate documentation projections
        run: python scripts/generate_docs.py

      - name: Validate documentation system
        run: |
          python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
          python scripts/generate_docs.py --check

      - name: Commit validated accepted promotion
        run: |
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: promote accepted M0 R0 remediation revision"
          git push origin HEAD:docs/architecture-baseline
