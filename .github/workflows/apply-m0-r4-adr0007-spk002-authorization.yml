name: Apply M0 R4 ADR-0007 and SPK-002 Authorization

on:
  push:
    branches:
      - docs/m0-r4-adr0007-spk002-authorization
    paths:
      - ".github/workflows/apply-m0-r4-adr0007-spk002-authorization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r4-adr0007-spk002-authorization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact authorization state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {n}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          adr = 'docs/adr/0007-m0-sqlite-operational-store.md'
          replace_once(adr, 'status: proposed\nversion: 0.2.0', 'status: accepted\naccepted_at: 2026-08-07\nacceptance_evidence: DOC-AURORA-M0-R4-ADR0007-ACCEPTANCE-SPK002-AUTHORIZATION\nversion: 0.2.0')
          replace_once(adr, '  - proposed M0 operational-state database class, Go binding and durability posture', '  - M0 operational-state database class, Go binding and durability posture')
          replace_once(adr, '**Proposed, evidence-ready for operator acceptance:** use **SQLite** as the M0 operational-state store with **`database/sql` + `modernc.org/sqlite` as the initial Go binding baseline**.', '**Accepted by the operator on 2026-08-07:** use **SQLite** as the M0 operational-state store with **`database/sql` + `modernc.org/sqlite` as the initial Go binding baseline**.')
          replace_once(adr, 'This ADR is still `proposed`. SPK-001 evidence completion does not substitute for operator acceptance.', 'This ADR is `accepted`. Acceptance selects the R4 architecture decision; it does not authorize production implementation, R5, R6 or promotion of spike code.')
          replace_once(adr, 'Before this ADR can govern implementation:\n\n```text\noperator reviews ADR-0007 revision 0.2.0\n→ ACCEPTED | REJECTED | REVISED\n```\n\nNo further M0 store Architecture Spike is required unless new material evidence contradicts SPK-001.', 'ADR-0007 v0.2.0 was accepted by the operator through `DOC-AURORA-M0-R4-ADR0007-ACCEPTANCE-SPK002-AUTHORIZATION`. No further M0 store Architecture Spike is required unless new material evidence contradicts SPK-001. Implementation still requires the later separately authorized ACRM gates.')
          replace_once(adr, '- `SPK-AURORA-M0-SOVEREIGN-STORE-001`\n', '- `SPK-AURORA-M0-SOVEREIGN-STORE-001`\n- `DOC-AURORA-M0-R4-ADR0007-ACCEPTANCE-SPK002-AUTHORIZATION`\n')

          idx = 'docs/adr/README.md'
          replace_once(idx, '| [ADR-0007](0007-m0-sqlite-operational-store.md) | SQLite as the M0 Operational State Store | proposed / evidence-ready | SQLite + `modernc.org/sqlite` proposed after SPK-001 PASS; operator acceptance still required |', '| [ADR-0007](0007-m0-sqlite-operational-store.md) | SQLite as the M0 Operational State Store | accepted | SQLite + `modernc.org/sqlite` selected for M0 operational state; implementation remains separately gated |')
          replace_once(idx, 'ADR-0007 remains proposed, but its required SPK-001 executable evidence is now complete and reviewed. Revision `0.2.0` proposes SQLite + `modernc.org/sqlite` and is ready for operator acceptance/rejection/revision.', 'ADR-0007 v0.2.0 was explicitly accepted by the operator on 2026-08-07 through `DOC-AURORA-M0-R4-ADR0007-ACCEPTANCE-SPK002-AUTHORIZATION`.')
          replace_once(idx, 'ADR-0008 remains proposed and MUST NOT be accepted before its separately required `SPK-AURORA-M0-OWNER-TRUST-002` evidence is complete and reviewed. SPK-002 execution is not authorized by SPK-001 completion.', 'ADR-0008 remains proposed and MUST NOT be accepted before its separately required `SPK-AURORA-M0-OWNER-TRUST-002` evidence is complete and reviewed. SPK-002 execution is explicitly authorized by `DOC-AURORA-M0-R4-ADR0007-ACCEPTANCE-SPK002-AUTHORIZATION`; no other spike is authorized by implication.')

          status = 'docs/tracking/STATUS.md'
          replace_once(status, 'version: 0.19.0', 'version: 0.20.0')
          replace_once(status, '  - DOC-AURORA-M0-R4-SPK001-EVIDENCE-RECEIPT\n', '  - DOC-AURORA-M0-R4-SPK001-EVIDENCE-RECEIPT\n  - DOC-AURORA-M0-R4-ADR0007-ACCEPTANCE-SPK002-AUTHORIZATION\n')
          replace_once(status, '- **ADR-0007:** PROPOSED / EVIDENCE-READY — SQLite + `modernc.org/sqlite` recommended by reviewed SPK-001; operator decision pending', '- **ADR-0007:** ACCEPTED — SQLite + `database/sql` + `modernc.org/sqlite` is the M0 operational-state baseline')
          replace_once(status, '- **SPK-AURORA-M0-OWNER-TRUST-002:** PROPOSED / EXECUTION NOT AUTHORIZED — sequencing dependency on reviewed SPK-001 is now satisfied, but separate authorization is still required', '- **SPK-AURORA-M0-OWNER-TRUST-002:** AUTHORIZED FOR EXECUTION — exact canonical spec v0.1.0 / blob `0ffb6fa2b35014e34b4301365dc2d5a8d96f021d`; no other spike authorized')
          replace_once(status, '- **R4 verdict:** BLOCKED — SPK-001 is closed; ADR-0007 operator decision and SPK-002/ADR-0008 evidence/decision remain', '- **R4 verdict:** BLOCKED — ADR-0007 is accepted; SPK-002 execution/review and ADR-0008 operator decision remain')
          replace_once(status, '- **Accepted technical decisions:** ADR-0003, ADR-0004, ADR-0005, ADR-0006 and ADR-0009; ADR-0007 is evidence-ready but not accepted; owner-root mechanism remains unresolved', '- **Accepted technical decisions:** ADR-0003, ADR-0004, ADR-0005, ADR-0006, ADR-0007 and ADR-0009; owner-root mechanism remains unresolved')
          replace_once(status, 'R4 M0 decision coverage:         15/15 mapped; ADR-0003/4/5/6 accepted; ADR-0007 evidence-ready; ADR-0008 SPK-002-blocked', 'R4 M0 decision coverage:         15/15 mapped; ADR-0003/4/5/6/7 accepted; ADR-0008 SPK-002-blocked')
          replace_once(status, 'Architecture Spike execution:   SPK-001 CLOSED; SPK-002 AND ALL OTHER SPIKES NOT AUTHORIZED', 'Architecture Spike execution:   SPK-001 CLOSED; SPK-002 AUTHORIZED ONLY; all other spikes NOT AUTHORIZED')
          replace_once(status, 'Accepted technical decisions:   ADR-0003 / ADR-0004 / ADR-0005 / ADR-0006 / ADR-0009', 'Accepted technical decisions:   ADR-0003 / ADR-0004 / ADR-0005 / ADR-0006 / ADR-0007 / ADR-0009')
          replace_once(status, 'The reviewed store recommendation is SQLite + `database/sql` + `modernc.org/sqlite` as the initial binding baseline. ADR-0007 revision `0.2.0` remains proposed and requires operator acceptance/rejection/revision before it becomes governing.', 'The operator accepted ADR-0007 revision `0.2.0`: SQLite + `database/sql` + `modernc.org/sqlite` is now the governing M0 store architecture decision. This acceptance does not authorize production implementation.')
          replace_once(status, 'The remaining R4 blockers are now narrower:\n\n1. operator decides evidence-informed ADR-0007;\n2. `SPK-AURORA-M0-OWNER-TRUST-002` requires separate explicit execution authorization;\n3. after SPK-002 evidence is reviewed, ADR-0008 must be accepted/rejected/revised.', 'The remaining R4 blockers are now narrower:\n\n1. execute and independently review the explicitly authorized `SPK-AURORA-M0-OWNER-TRUST-002`;\n2. after SPK-002 evidence is reviewed, ADR-0008 must be accepted/rejected/revised by the operator.')
          replace_once(status, 'SPK-001 completion does not authorize SPK-002.', 'SPK-002 is now explicitly authorized by the operator; no other spike is authorized by implication.')
          replace_once(status, 'SPK-AURORA-M0-SOVEREIGN-STORE-001 PASS / CLOSED\n→ operator reviews ADR-0007 v0.2.0 (SQLite + modernc.org/sqlite)\n→ accept / reject / revise ADR-0007\n→ STOP\n→ SPK-AURORA-M0-OWNER-TRUST-002 remains NOT AUTHORIZED until separately approved\n→ do not begin R5', 'ADR-0007 v0.2.0 ACCEPTED\n→ SPK-AURORA-M0-OWNER-TRUST-002 AUTHORIZED\n→ execute exact disposable owner-root/trust spike against fixed revision\n→ independently review evidence\n→ present evidence-informed ADR-0008 decision to operator\n→ STOP\n→ do not begin R5')

          worklog = Path('docs/tracking/WORKLOG.md')
          w = worklog.read_text(encoding='utf-8').rstrip()
          w += '''\n\n## 2026-08-07 — ADR-0007 Acceptance and SPK-002 Authorization\n\nThe operator explicitly accepted ADR-0007 v0.2.0 and authorized execution of `SPK-AURORA-M0-OWNER-TRUST-002` according to the canonical specification at repository revision `f895ac44990cbebe3d366b703c661b2ec6f67e2b`, spec blob `0ffb6fa2b35014e34b4301365dc2d5a8d96f021d`, version 0.1.0.\n\nADR-0007 is now accepted. SPK-002 is the only Architecture Spike authorized for execution. ADR-0008 remains proposed; R5, Mission Contract, Microdesign and production implementation remain unauthorized.\n'''
          worklog.write_text(w, encoding='utf-8')

          research = 'docs/research/RESEARCH-MAP.md'
          replace_once(research, 'documentary research complete; `SPK-AURORA-M0-OWNER-TRUST-002` specified, execution not authorized', 'documentary research complete; `SPK-AURORA-M0-OWNER-TRUST-002` specified and explicitly authorized for execution; evidence not yet reviewed')
          PY
      - name: Generate documentation projections
        run: python scripts/docs/generate.py
      - name: Validate documentation system
        run: python scripts/docs/validate.py
      - name: Verify authorization boundary
        shell: bash
        run: |
          grep -F 'status: accepted' docs/adr/0007-m0-sqlite-operational-store.md
          grep -F 'SPK-002 AUTHORIZED ONLY' docs/tracking/STATUS.md
          grep -F 'R5 — Contract Readiness:    NOT AUTHORIZED' docs/tracking/STATUS.md
          grep -F 'ADR-0008 remains proposed' docs/acceptance/2026-08-07-m0-r4-adr0007-acceptance-spk002-authorization.md
          git diff --check
      - name: Commit validated authority state and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-m0-r4-adr0007-spk002-authorization.yml
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add docs generated .github/workflows/apply-m0-r4-adr0007-spk002-authorization.yml
          git diff --cached --check
          git commit -m 'docs: accept ADR-0007 and authorize SPK-002'
          git push origin HEAD:docs/m0-r4-adr0007-spk002-authorization
