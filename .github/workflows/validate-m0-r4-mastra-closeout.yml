name: Validate M0 R4 Mastra closeout

on:
  push:
    branches:
      - docs/m0-r4-mastra-substrate-assessment
    paths:
      - ".github/workflows/validate-m0-r4-mastra-closeout.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/docs-validation-report.json"
      - name: Check projections and closeout boundary
        run: |
          diff -u docs/product/PRODUCT-BLUEPRINT.md "$RUNNER_TEMP/aurora-generated/docs/product/PRODUCT-BLUEPRINT.md"
          diff -u docs/roadmap.md "$RUNNER_TEMP/aurora-generated/docs/roadmap.md"
          test "$(grep -o 'R4-Q-[A-Z]*-[0-9][0-9][0-9]' docs/capabilities/CAP-SOVEREIGN-CORE/R4-DECISION-COVERAGE.md | sort -u | wc -l)" -eq 15
          grep -q '^status: proposed$' docs/adr/0009-mastra-cognitive-harness-runtime.md
          grep -q 'STOP Mastra investigation for M0' docs/tracking/STATUS.md
          grep -q 'SPK-AURORA-M0-SOVEREIGN-STORE-001' docs/tracking/STATUS.md
          grep -q 'Mastra integration spike:       NOT REQUIRED FOR M0' docs/tracking/STATUS.md
          if grep -R "Execution: AUTHORIZED" docs/design docs/adr docs/research; then
            echo "unexpected architecture-spike authorization"
            exit 1
          fi
          echo "M0 R4 Mastra closeout validation PASS"
