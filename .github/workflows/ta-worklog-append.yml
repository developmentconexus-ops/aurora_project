name: Append TA-01/TA-02 Worklog

on:
  push:
    branches:
      - docs/ta-01-02-module-runtime-topology-20260812
    paths:
      - .github/workflows/ta-worklog-append.yml

permissions:
  contents: write

jobs:
  append-worklog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/ta-01-02-module-runtime-topology-20260812
          fetch-depth: 0

      - name: Append exact worklog entry
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('docs/tracking/WORKLOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 2026-08-12 — TA-01/TA-02 module ownership and runtime topology proposal'
          if heading in text:
              raise SystemExit(0)

          old = 'version: 0.14.0'
          if old not in text:
              raise SystemExit('expected WORKLOG version 0.14.0 not found')
          text = text.replace(old, 'version: 0.15.0', 1)

          entry = base64.b64decode('').decode('utf-8')
          path.write_text(text.rstrip() + '\n\n' + entry.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit append
        shell: bash
        run: |
          if git diff --quiet -- docs/tracking/WORKLOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/WORKLOG.md
          git commit -m "docs: append TA-01 and TA-02 worklog"
          git push origin HEAD:docs/ta-01-02-module-runtime-topology-20260812
