name: Close M0 R4 SPK-002 Evidence v2

on:
  push:
    branches:
      - docs/m0-r4-spk002-evidence
    paths:
      - ".github/workflows/close-m0-r4-spk002-evidence-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r4-spk002-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply SPK-002 closeout tracking transformation
        run: python scripts/tmp_close_spk002.py
      - name: Normalize WORKLOG EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/tracking/WORKLOG.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
      - name: Verify closeout boundary
        shell: bash
        run: |
          grep -F 'status: proposed' docs/adr/0008-m0-owner-root-recovery-trust.md
          grep -F 'version: 0.2.0' docs/adr/0008-m0-owner-root-recovery-trust.md
          grep -F 'SPK-AURORA-M0-OWNER-TRUST-002:** PASS / EVIDENCE_COMPLETE / REVIEWED / DECISION_INFORMED / CLOSED' docs/tracking/STATUS.md
          grep -F 'R4 BLOCKED' docs/tracking/STATUS.md
          grep -F 'R5 — Contract Readiness:    NOT AUTHORIZED' docs/tracking/STATUS.md
          test ! -d spikes/m0-owner-trust-002
          git diff --check
      - name: Commit validated docs-only closeout and remove helpers
        shell: bash
        run: |
          rm .github/workflows/close-m0-r4-spk002-evidence.yml
          rm .github/workflows/close-m0-r4-spk002-evidence-v2.yml
          rm scripts/tmp_close_spk002.py
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add docs .github/workflows/close-m0-r4-spk002-evidence.yml .github/workflows/close-m0-r4-spk002-evidence-v2.yml scripts/tmp_close_spk002.py
          git diff --cached --check
          git commit -m 'docs: close SPK-002 evidence and make ADR-0008 evidence-ready'
          git push origin HEAD:docs/m0-r4-spk002-evidence
