name: Close M0 R0 remediation merge

on:
  push:
    branches:
      - main
    paths:
      - docs/acceptance/2026-08-07-m0-r0-remediation-merge-closeout.md

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify accepted merge is canonical ancestor
        run: |
          git merge-base --is-ancestor d0ddfb794296e599ac96bb73bf3772937d371bf9 HEAD
          test -f docs/acceptance/2026-08-07-m0-r0-remediation-operator-acceptance.md

      - name: Close tracking state
        run: python scripts/close_m0_r0_remediation_merge.py

      - name: Validate documentation system
        run: |
          python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
          python scripts/generate_docs.py --check

      - name: Commit validated merge closeout
        run: |
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close M0 R0 remediation merge state"
          git push origin HEAD:main
