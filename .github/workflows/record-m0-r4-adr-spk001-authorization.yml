name: Record M0 R4 ADR acceptance and SPK-001 authorization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/record-m0-r4-adr-spk001-authorization.yml"
      - ".github/scripts/record_m0_r4_adr_spk001_authorization.py"
      - ".github/m0-r4-adr-spk001-authorization.trigger"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record operator decision and authorization
        run: python .github/scripts/record_m0_r4_adr_spk001_authorization.py

      - name: Normalize worklog EOF
        shell: bash
        run: python -c "from pathlib import Path; p=Path('docs/tracking/WORKLOG.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"

      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"

      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/docs-validation-report.json"

      - name: Verify authority boundary
        shell: bash
        run: |
          grep -q "status: accepted" docs/adr/0003-m0-go-core-runtime.md
          grep -q "status: accepted" docs/adr/0004-m0-local-state-execution-shape.md
          grep -q "status: accepted" docs/adr/0005-m0-portable-state-export.md
          grep -q "status: accepted" docs/adr/0006-m0-observability-boundary.md
          grep -q "status: accepted" docs/adr/0009-mastra-cognitive-harness-runtime.md
          grep -q "SPK-AURORA-M0-SOVEREIGN-STORE-001.*AUTHORIZED FOR EXECUTION" docs/tracking/STATUS.md
          grep -q "SPK-AURORA-M0-OWNER-TRUST-002.*EXECUTION NOT AUTHORIZED" docs/tracking/STATUS.md
          grep -q "R5 — Contract Readiness.*NOT AUTHORIZED" docs/tracking/STATUS.md
          git diff --check

      - name: Commit canonical authority update and remove helpers
        shell: bash
        run: |
          rm -f \
            .github/workflows/record-m0-r4-adr-spk001-authorization.yml \
            .github/scripts/record_m0_r4_adr_spk001_authorization.py \
            .github/m0-r4-adr-spk001-authorization.trigger
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add docs .github
          git diff --cached --check
          git commit -m "docs: accept R4 ADRs and authorize SPK-001"
          git push origin HEAD:main
