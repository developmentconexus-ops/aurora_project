name: Record M0 R4 ADR acceptance and SPK-001 authorization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/record-m0-r4-adr-spk001-authorization.yml"
      - ".github/m0-r4-adr-spk001-authorization.trigger"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record operator decision and authorization
        shell: bash
        run: |
          python - <<'PY'
