          import re
          import subprocess

          expected = "36f46956bc275d0aec32b7e3ea4d959010fa9dcb"
          current = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if current not in {expected, "HEAD"} and not Path('.github/m0-r4-adr-spk001-authorization.trigger').exists():
              raise SystemExit(f"unexpected baseline: {current}")

          evidence_id = "DOC-AURORA-M0-R4-ADR-ACCEPTANCE-SPK001-AUTHORIZATION"
          evidence_path = Path("docs/acceptance/2026-08-07-m0-r4-adr-acceptance-spk001-authorization.md")
          evidence_path.write_text(f'''---
