name: Close M0 R0 PASS tracking

on:
  push:
    branches:
      - main
    paths:
      - docs/acceptance/2026-08-07-m0-r0-pass-closeout.md

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fixed R0 target and PASS review exist
        run: |
          git merge-base --is-ancestor 6054f84d007347c0aa9eef9e71317134b1047d3c HEAD
          test -f docs/reviews/2026-08-07-m0-r0-constitutional-baseline-rerun.md
      - name: Close tracking at R0 PASS
        run: python scripts/close_m0_r0_pass.py
      - name: Validate documentation system
        run: |
          python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
          python scripts/generate_docs.py --check
      - name: Commit validated R0 PASS handoff
        run: |
          git config user.name "developmentconexus-ops"
          git config user.email "development.conexus@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close M0 R0 PASS tracking state"
          git push origin HEAD:main
