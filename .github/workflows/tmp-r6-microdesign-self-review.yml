name: Temporary R6 Microdesign Self Review

on:
  push:
    branches:
      - docs/m0-r6-implementation-design-readiness
    paths:
      - "scripts/tmp_patch_r6_microdesign.py"
      - ".github/workflows/tmp-r6-microdesign-self-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m0-r6-implementation-design-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply self-review corrections
        run: python scripts/tmp_patch_r6_microdesign.py
      - name: Move Microdesign to canonical design path
        run: git mv docs/capabilities/CAP-SOVEREIGN-CORE/M0-R6-MICRODESIGN.md docs/design/M0-R6-SOVEREIGN-CORE-MICRODESIGN.md
      - name: Mechanical Microdesign review
        shell: bash
        run: |
          set -euo pipefail
          file=docs/design/M0-R6-SOVEREIGN-CORE-MICRODESIGN.md
          ! grep -E '\b(TBD|TODO|FIXME)\b' "$file"
          grep -F 'domain + ports' "$file"
          grep -F 'M0 begins with six tables.' "$file"
          grep -F 'current governing logical snapshot' "$file"
          grep -F 'per-table/per-row HMACs' "$file"
          grep -F 'MOVEFILE_REPLACE_EXISTING | MOVEFILE_WRITE_THROUGH' "$file"
          grep -F 'Mission-criterion design coverage' "$file"
          grep -F 'R7 implementation authority implied' "$file"
          test "$(grep -c '^#### `' "$file")" -eq 6
          git diff --check
      - name: Generate documentation projections
        run: python scripts/generate_docs.py --output-root "$RUNNER_TEMP/aurora-generated"
      - name: Validate documentation system
        run: |
          python scripts/validate_docs.py \
            --generated-root "$RUNNER_TEMP/aurora-generated" \
            --report "$RUNNER_TEMP/aurora-generated/docs-validation-report.json"
      - name: Commit docs-only reviewed Microdesign and remove helpers
        shell: bash
        run: |
          rm .github/workflows/tmp-r6-microdesign-self-review.yml scripts/tmp_patch_r6_microdesign.py
          git config user.name developmentconexus-ops
          git config user.email development.conexus@gmail.com
          git add -A docs .github/workflows/tmp-r6-microdesign-self-review.yml scripts/tmp_patch_r6_microdesign.py
          git diff --cached --check
          bad="$(git diff --cached --name-status | awk '$2 !~ /^docs\// && $1 !~ /^D/ {print}')"
          if [[ -n "$bad" ]]; then
            echo "non-doc permanent diff detected:" >&2
            echo "$bad" >&2
            exit 1
          fi
          git commit -m 'docs: self-review M0 R6 sovereign core microdesign'
          git push origin HEAD:docs/m0-r6-implementation-design-readiness
