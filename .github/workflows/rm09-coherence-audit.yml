name: RM-09 Coherence Audit

on:
  push:
    branches:
      - docs/mr-01-repository-migration-20260823
    paths:
      - .github/workflows/rm09-coherence-audit.yml
      - scripts/rm09_cleanup.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rm09-coherence-audit.yml
      - scripts/rm09_cleanup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == '' || github.head_ref == 'docs/mr-01-repository-migration-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mr-01-repository-migration-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded current-authority cleanup
        run: python scripts/rm09_cleanup.py
      - name: Commit cleanup without workflow mutation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No cleanup changes" >&2; exit 1; }
          git commit -m "docs(mr-01): close RM-09 current-authority coherence gaps"
          git push origin HEAD:docs/mr-01-repository-migration-20260823

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current-authority surfaces for legacy routing and terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('README.md'), Path('AGENTS.md'), Path('CONTRIBUTING.md')]
          for rel in ['docs/index.md','docs/roadmap.md','docs/product','docs/architecture','docs/decisions','docs/development','docs/capabilities','docs/reference']:
              p = Path(rel)
              if p.is_file(): roots.append(p)
              elif p.is_dir(): roots.extend(sorted(p.rglob('*.md')))

          patterns = {
              'legacy_path': re.compile(r'(?:docs/|\.\./)(?:tracking|superpowers|design|acceptance|reviews)/'),
              'status_token': re.compile(r'\bSTATUS(?:\.md)?\b'),
              'mnfs': re.compile(r'\bMNFS\b'),
              'old_ta_order': re.compile(r'TA-03\s+(?:Repository|repositories)|TA-08\s+(?:Configuration|operations)', re.I),
              'roadmap_generated': re.compile(r'(?:roadmap.{0,30}generated|generated.{0,30}roadmap)', re.I),
          }

          results=[]
          for path in sorted(set(roots)):
              if not path.exists(): continue
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  for kind,pat in patterns.items():
                      if pat.search(line):
                          results.append((kind,path.as_posix(),n,line.strip()))
          print(f'RM09_MATCH_COUNT={len(results)}')
          for kind,path,n,line in results:
              print(f'{kind}\t{path}:{n}\t{line}')
          PY
